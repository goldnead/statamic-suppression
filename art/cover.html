<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #450A0A 0%, #2E0808 55%, #120303 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FECACA; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #F87171; box-shadow: 0 0 18px #F87171; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FCA5A5,#EF4444); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FEE2E2; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(220,38,38,.28), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Suppression</span></h1>
      <p class="sub">The authoritative answer to whether an address may be mailed at all, shared by every addon that queues mail.</p>
      <div class="badges">
        <span class="badge">Global gate</span>
        <span class="badge">Bounces</span>
        <span class="badge">Complaints</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#DC2626"/><stop offset="1" stop-color="#7F1D1D"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#450A0A" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- the gate every sender has to ask. A shield, not an envelope:
             Marketing already owns the envelope. -->
        <g filter="url(#sh)">
          <path d="M256 84 L404 142 V268 C404 350 342 404 256 428 C170 404 108 350 108 268 V142 Z" fill="#FFFFFF"/>
        </g>
        <!-- the answer that stops the send -->
        <rect x="176" y="238" width="160" height="38" rx="19" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
